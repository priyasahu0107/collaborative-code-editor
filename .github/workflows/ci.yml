name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20'
  NPM_VERSION: '10'

jobs:
  # ============================================================================
  # Quality Checks
  # ============================================================================
  quality-checks:
    name: Quality Checks
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Prettier check
        run: npm run format:check

      - name: Run TypeScript type check
        run: npm run typecheck

      - name: Run linter
        run: npm run lint

  # ============================================================================
  # Build Verification
  # ============================================================================
  build:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: quality-checks
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build client
        run: npm run build:client

      - name: Build server
        run: npm run build:server

      - name: Build execution service
        run: npm run build:execution

      - name: Upload client build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: client/dist/
          retention-days: 7

      - name: Upload server build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: server-dist
          path: server/dist/
          retention-days: 7

  # ============================================================================
  # Unit Tests
  # ============================================================================
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: quality-checks
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run server tests
        run: npm run test:server
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/test
          JWT_SECRET: test-secret-key-for-ci-pipeline-min-32-chars
          JWT_EXPIRES_IN: 15m
          COOKIE_NAME: auth_token
          COOKIE_SAME_SITE: lax

      - name: Run execution API tests
        run: npm run test:execution

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            server/coverage/
            client/coverage/
          retention-days: 7

  # ============================================================================
  # Security Audit
  # ============================================================================
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: quality-checks
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Check for critical vulnerabilities
        run: |
          AUDIT_RESULT=$(npm audit --json 2>/dev/null || true)
          CRITICAL_COUNT=$(echo "$AUDIT_RESULT" | jq '.metadata.vulnerabilities.critical // 0')
          HIGH_COUNT=$(echo "$AUDIT_RESULT" | jq '.metadata.vulnerabilities.high // 0')
          
          echo "Critical vulnerabilities: $CRITICAL_COUNT"
          echo "High vulnerabilities: $HIGH_COUNT"
          
          if [ "$CRITICAL_COUNT" -gt 0 ]; then
            echo "::error::Critical vulnerabilities found!"
            exit 1
          fi
          
          if [ "$HIGH_COUNT" -gt 5 ]; then
            echo "::warning::High number of high-severity vulnerabilities: $HIGH_COUNT"
          fi

  # ============================================================================
  # Integration Tests (Optional - requires MongoDB)
  # ============================================================================
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [build, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd mongosh --eval "db.adminCommand('ping')"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Wait for MongoDB
        run: |
          timeout 60 bash -c 'until nc -z localhost 27017; do sleep 1; done'

      - name: Run integration tests
        run: npm run test:server
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/collab-editor-test
          JWT_SECRET: test-secret-key-for-integration-tests-min-32-chars
          JWT_EXPIRES_IN: 15m
          COOKIE_NAME: auth_token
          COOKIE_SAME_SITE: lax

  # ============================================================================
  # Deployment Readiness Check
  # ============================================================================
  deployment-readiness:
    name: Deployment Readiness Check
    runs-on: ubuntu-latest
    needs: [build, test, security-audit]
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check deployment documentation
        run: |
          if [ ! -f "docs/DEPLOYMENT.md" ]; then
            echo "::error::DEPLOYMENT.md not found!"
            exit 1
          fi
          
          if [ ! -f "docs/SECURITY.md" ]; then
            echo "::error::SECURITY.md not found!"
            exit 1
          fi
          
          echo "✅ Deployment documentation present"

      - name: Verify environment configuration
        run: |
          if [ ! -f "server/.env.example" ]; then
            echo "::error::server/.env.example not found!"
            exit 1
          fi
          
          if [ ! -f "client/.env.example" ]; then
            echo "::error::client/.env.example not found!"
            exit 1
          fi
          
          echo "✅ Environment configuration files present"

      - name: Deployment readiness summary
        run: |
          echo "✅ All deployment readiness checks passed!"
          echo ""
          echo "The application is ready for deployment."
          echo ""
          echo "Next steps:"
          echo "1. Review the deployment documentation in docs/DEPLOYMENT.md"
          echo "2. Configure production environment variables"
          echo "3. Set up MongoDB Atlas connection"
          echo "4. Configure SSL/TLS certificates"
          echo "5. Deploy the Node.js services using the deployment guide"
