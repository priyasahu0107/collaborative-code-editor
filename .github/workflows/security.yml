name: Security Audit

on:
  schedule:
    # Run security audit weekly on Monday at 00:00 UTC
    - cron: '0 0 * * 1'
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: # Allow manual trigger

env:
  NODE_VERSION: '20'

jobs:
  # ============================================================================
  # Dependency Security Audit
  # ============================================================================
  dependency-audit:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        id: audit
        run: |
          npm audit --json > audit-results.json || true
          
          # Extract vulnerability counts
          CRITICAL=$(jq '.metadata.vulnerabilities.critical' audit-results.json)
          HIGH=$(jq '.metadata.vulnerabilities.high' audit-results.json)
          MODERATE=$(jq '.metadata.vulnerabilities.moderate' audit-results.json)
          LOW=$(jq '.metadata.vulnerabilities.low' audit-results.json)
          
          echo "critical=$CRITICAL" >> $GITHUB_OUTPUT
          echo "high=$HIGH" >> $GITHUB_OUTPUT
          echo "moderate=$MODERATE" >> $GITHUB_OUTPUT
          echo "low=$LOW" >> $GITHUB_OUTPUT
          
          # Display summary
          echo "## Security Audit Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Critical: $CRITICAL" >> $GITHUB_STEP_SUMMARY
          echo "- High: $HIGH" >> $GITHUB_STEP_SUMMARY
          echo "- Moderate: $MODERATE" >> $GITHUB_STEP_SUMMARY
          echo "- Low: $LOW" >> $GITHUB_STEP_SUMMARY

      - name: Upload audit results
        uses: actions/upload-artifact@v4
        with:
          name: security-audit-results
          path: audit-results.json
          retention-days: 30

      - name: Fail on critical vulnerabilities
        if: steps.audit.outputs.critical > 0
        run: |
          echo "::error::Critical vulnerabilities found! Please review audit-results.json"
          exit 1

      - name: Warn on high vulnerabilities
        if: steps.audit.outputs.high > 5
        run: |
          echo "::warning::High number of high-severity vulnerabilities: ${{ steps.audit.outputs.high }}"

  # ============================================================================
  # Code Security Scan
  # ============================================================================
  code-security-scan:
    name: Code Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run CodeQL Analysis
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  # ============================================================================
  # Secret Detection
  # ============================================================================
  secret-detection:
    name: Secret Detection
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for all branches and tags

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Check for hardcoded secrets
        run: |
          # Check for common secret patterns
          echo "Checking for hardcoded secrets..."
          
          # Check for API keys
          if grep -r "API_KEY\s*=\s*['\"][a-zA-Z0-9]" --include="*.ts" --include="*.tsx" --include="*.js" .; then
            echo "::error::Potential hardcoded API key found!"
            exit 1
          fi
          
          # Check for passwords
          if grep -r "password\s*=\s*['\"][^'\"]\{8,\}" --include="*.ts" --include="*.tsx" --include="*.js" . | grep -v "test" | grep -v "example"; then
            echo "::error::Potential hardcoded password found!"
            exit 1
          fi
          
          # Check for JWT secrets
          if grep -r "JWT_SECRET\s*=\s*['\"][^'\"]\{8,\}" --include="*.ts" --include="*.tsx" --include="*.js" . | grep -v "example" | grep -v "test"; then
            echo "::error::Potential hardcoded JWT secret found!"
            exit 1
          fi
          
          echo "✅ No hardcoded secrets detected"

  # ============================================================================
  # Docker Security Scan
  # ============================================================================
  docker-security-scan:
    name: Docker Security Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build client Docker image
        run: docker build -t collab-editor-client:scan ./client

      - name: Scan client image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'collab-editor-client:scan'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Build server Docker image
        run: docker build -t collab-editor-server:scan ./server

      - name: Scan server image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'collab-editor-server:scan'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Build execution service Docker image
        run: docker build -t collab-editor-execution:scan ./execution-service

      - name: Scan execution service image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'collab-editor-execution:scan'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

  # ============================================================================
  # Security Report
  # ============================================================================
  security-report:
    name: Security Report
    runs-on: ubuntu-latest
    needs: [dependency-audit, code-security-scan, secret-detection]
    if: always()
    
    steps:
      - name: Generate security report
        run: |
          echo "## Security Audit Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Date:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "- Dependency Audit: ${{ needs.dependency-audit.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Code Security Scan: ${{ needs.code-security-scan.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Secret Detection: ${{ needs.secret-detection.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [[ "${{ needs.dependency-audit.result }}" == "success" && "${{ needs.code-security-scan.result }}" == "success" && "${{ needs.secret-detection.result }}" == "success" ]]; then
            echo "✅ All security checks passed!" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Some security checks failed. Please review the logs." >> $GITHUB_STEP_SUMMARY
          fi
