version: '3.8'

services:
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    environment:
      - VITE_API_BASE_URL=http://server:5000
      - VITE_SOCKET_URL=http://server:5000
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - '5000:5000'
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongo:27017/collaborative-editor
      - CLIENT_URL=http://localhost:3000
      - JWT_SECRET=${JWT_SECRET:-change-this-secret-in-production-min-32-chars}
      - JWT_EXPIRES_IN=15m
      - COOKIE_NAME=auth_token
      - COOKIE_SAME_SITE=lax
      - EXECUTION_SERVICE_URL=http://execution-service:4000
    depends_on:
      mongo:
        condition: service_started
      execution-service:
        condition: service_healthy
    restart: unless-stopped

  execution-service:
    build:
      context: ./execution-service
      dockerfile: Dockerfile
    ports:
      - '4000:4000'
    environment:
      - PORT=4000
      - NODE_ENV=production
      - API_SERVER_URL=http://server:5000
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  mongo:
    image: mongo:7
    ports:
      - '27017:27017'
    volumes:
      - mongo-/data/db
    restart: unless-stopped

volumes:
  mongo-
